<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>BMC / PCIe Study Notes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AST2700 / OpenBMC / PCIe / MCTP 學習與實務筆記">
  <!-- Docsify 主題（vue 風格） -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    /* 讓側邊欄寬一點，中文標題比較好讀 */
    .sidebar { width: 320px; }
    .content { left: 320px; }
    @media screen and (max-width: 768px) {
      .content { left: 0; }
    }
    /* 表格與程式碼區塊在寬螢幕不要被撐爆 */
    .markdown-section { max-width: 900px; }
  </style>
</head>
<body>
  <div id="app">載入中 …</div>
  <script>
    window.$docsify = {
      name: 'BMC / PCIe Study Notes',
      // 首頁用 README.md
      homepage: 'README.md',
      // 讀取 _sidebar.md 當統一導覽
      loadSidebar: true,
      // 自動把每頁的 h2/h3 標題展開成側邊欄子目錄
      subMaxLevel: 3,
      // 右上角的「回首頁」
      auto2top: true,
      // 搜尋設定
      search: {
        placeholder: '搜尋筆記…',
        noData: '找不到結果',
        depth: 4
      }
    };
  </script>
  <!-- Docsify 本體 -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <!-- 全文搜尋 -->
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <!-- 程式碼一鍵複製 -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <!-- 常見語法高亮 -->
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-c.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
</body>
</html>
